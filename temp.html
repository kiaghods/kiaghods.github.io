<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gradient Descent → ∇ (Field + Colormap + Contours)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <script>
    // ========================= Setup =========================
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    // Offscreen canvas to rasterize the ∇ glyph and sample point targets
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');

    let W, H, CX, CY; resize();
    window.addEventListener('resize', () => { resize(); initField(); buildTargets(); });

    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      CX = W/2; CY = H/2;
      off.width = Math.min(W, 1400);
      off.height = Math.min(H, 700);
    }

    // ========================= Scalar Field (multi-extrema) =========================
    // f(x,y) = Σ s_i A_i exp(-((x-xi)^2 + (y-yi)^2)/(2σ_i^2)) where s_i ∈ {+1 (hill), -1 (well)}
    // We'll render a blue-based diverging colormap: dark navy (min) → teal → yellow (max)

    let blobs = [];
    function initField(){
      const s = Math.min(W, H);
      const sigma = s * 0.18;
      blobs = [
        { x: W*0.22, y: H*0.28, A: 1.0,  s: +1, sig: sigma*0.9 },  // hill
        { x: W*0.30, y: H*0.72, A: 1.2,  s: -1, sig: sigma*0.8 },  // well
        { x: W*0.74, y: H*0.30, A: 0.9,  s: +1, sig: sigma*0.85 }, // hill
        { x: W*0.78, y: H*0.75, A: 1.1,  s: -1, sig: sigma*0.75 }, // well
        { x: W*0.50, y: H*0.50, A: 0.6,  s: +1, sig: sigma*0.7 }   // subtle hill center
      ];
      // Precompute a coarse field grid for coloring & contours
      buildFieldGrid();
    }

    function fieldAt(x, y){
      let f = 0;
      for (const b of blobs){
        const dx = x - b.x, dy = y - b.y;
        const r2 = dx*dx + dy*dy;
        const e = Math.exp(-r2 / (2*b.sig*b.sig));
        f += b.s * b.A * e;
      }
      return f;
    }

    function gradAt(x, y){
      let gx = 0, gy = 0;
      for (const b of blobs){
        const dx = x - b.x, dy = y - b.y;
        const r2 = dx*dx + dy*dy;
        const e = Math.exp(-r2 / (2*b.sig*b.sig));
        const k = - (b.s * b.A * e) / (b.sig*b.sig); // derivative factor
        gx += k * dx;
        gy += k * dy;
      }
      return { gx, gy };
    }

    // ----- Field grid (for color map + contours) -----
    const GRID_STEP = 3; // px resolution for the heatmap/contours (performance vs detail)
    let gridW = 0, gridH = 0, gridVals = null, fMin = 0, fMax = 0;

    function buildFieldGrid(){
      gridW = Math.ceil(W / GRID_STEP);
      gridH = Math.ceil(H / GRID_STEP);
      gridVals = new Float32Array(gridW*gridH);
      fMin =  Infinity; fMax = -Infinity;
      for (let gy=0; gy<gridH; gy++){
        const y = gy*GRID_STEP + GRID_STEP/2;
        for (let gx=0; gx<gridW; gx++){
          const x = gx*GRID_STEP + GRID_STEP/2;
          const v = fieldAt(x,y);
          gridVals[gy*gridW + gx] = v;
          if (v < fMin) fMin = v; if (v > fMax) fMax = v;
        }
      }
    }

    function norm(v){
      return (v - fMin) / (fMax - fMin + 1e-9);
    }

    // Blue-based diverging colormap (min→max): deep navy → blue/teal → green → yellow
    function colormap(t){
      // clamp
      t = Math.max(0, Math.min(1, t));
      // piecewise gradient for contrast
      let r,g,b;
      if (t < 0.33){
        // 0..0.33: navy (8,16,64) → blue (20,100,200)
        const u = t/0.33;
        r = 8   + (20-8)*u;
        g = 16  + (100-16)*u;
        b = 64  + (200-64)*u;
      } else if (t < 0.66){
        // 0.33..0.66: blue → teal/green (40,170,140)
        const u = (t-0.33)/0.33;
        r = 20  + (40-20)*u;
        g = 100 + (170-100)*u;
        b = 200 + (140-200)*u;
      } else {
        // 0.66..1: teal/green → yellow (240,230,120)
        const u = (t-0.66)/0.34;
        r = 40  + (240-40)*u;
        g = 170 + (230-170)*u;
        b = 140 + (120-140)*u;
      }
      return `rgb(${r|0},${g|0},${b|0})`;
    }

    function renderField(){
      // draw colored rectangles at grid resolution
      for (let gy=0; gy<gridH; gy++){
        for (let gx=0; gx<gridW; gx++){
          const v = gridVals[gy*gridW + gx];
          ctx.fillStyle = colormap(norm(v));
          ctx.fillRect(gx*GRID_STEP, gy*GRID_STEP, GRID_STEP, GRID_STEP);
        }
      }
    }

    function drawContours(){
      // draw isolines based on field value thresholds
      const levels = 14; // number of contour levels
      for (let i=1; i<levels; i++){
        const t = i/levels;
        const target = fMin + t*(fMax - fMin);
        ctx.beginPath();
        for (let gy=0; gy<gridH; gy++){
          for (let gx=0; gx<gridW; gx++){
            const v = gridVals[gy*gridW + gx];
            // mark a dot when close to target value to approximate a line
            if (Math.abs(v - target) < (fMax - fMin)/300){
              ctx.rect(gx*GRID_STEP, gy*GRID_STEP, 1, 1);
            }
          }
        }
        // contour color: deeper blue lines for contrast
        ctx.strokeStyle = `rgba(10, 30, 120, 0.65)`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    // ========================= Particles =========================
    const N = Math.min(1800, Math.floor((W*H)/700));
    const pts = [];
    for (let i=0;i<N;i++) {
      pts.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vx: 0, vy: 0,
        t: null // target {x,y}, assigned later
      });
    }

    // Motion params (softer near minima)
    const DESCENT_LR = 0.045;      // base learning rate
    const DESCENT_DAMP = 0.92;     // damping during descent
    const MORPH_K = 0.018;         // spring stiffness to targets
    const MORPH_DAMP = 0.90;       // damping during morph
    const PARTICLE_RADIUS = 1.8;   // dot size
    const PHASE_TIME = 7.0;        // seconds before morph (fallback)
    const PHASE_RADIUS_TRIGGER = 16; // mean radius trigger around chosen minimum

    // Extra slowing near the chosen minimum
    const SLOW_ZONE_RADIUS = 110;  // px
    const SLOW_ZONE_DAMP = 0.72;   // extra damping factor
    const SPEED_CAP = 3.0;         // px/frame
    const SLOW_SPEED_CAP = 1.4;    // px/frame inside slow zone

    // Chosen minimum is the deepest well from our blobs
    function deepestWell(){
      // pick the negative blob with largest A
      let w = null;
      for (const b of blobs){ if (b.s < 0){ if (!w || b.A > w.A) w = b; } }
      return w || blobs[0];
    }

    let targetWell = null;

    // ========================= Phases =========================
    // 1) Gradient descent along -∇f toward the deepest local minimum
    // 2) Morph outward into the large ∇ (nabla) logo
    let phase = 1;
    let phaseClock = 0; // seconds

    // Build targets for the ∇ glyph
    let targets = [];
    const SAMPLE_STEP = 6; // higher = fewer points (faster), lower = denser

    function buildTargets(){
      targets = [];
      const size = Math.min(off.width, off.height)*0.72; // glyph scale
      octx.clearRect(0,0,off.width,off.height);
      octx.fillStyle = '#fff';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.font = `900 ${size}px serif`;
      octx.fillText('\u2207', off.width/2, off.height/2);

      const img = octx.getImageData(0,0,off.width,off.height).data;
      for (let y=0; y<off.height; y+=SAMPLE_STEP) {
        for (let x=0; x<off.width; x+=SAMPLE_STEP) {
          const idx = (y*off.width + x)*4;
          const a = img[idx+3];
          if (a > 128) {
            const gx = x + (W - off.width)/2;
            const gy = y + (H - off.height)/2;
            targets.push({x: gx, y: gy});
          }
        }
      }
      // Shuffle targets
      for (let i=targets.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [targets[i],targets[j]]=[targets[j],targets[i]]; }
      // Assign each particle a target (wrap)
      pts.forEach((p,i)=>{ p.t = targets[i % targets.length]; });
    }

    initField();
    targetWell = deepestWell();
    buildTargets();

    // ========================= Animation =========================
    let last = performance.now();
    requestAnimationFrame(loop);

    function loop(now){
      const dt = Math.min(0.033, (now-last)/1000); // cap dt for stability
      last = now; phaseClock += dt;

      // Render field and contours first
      renderField();
      drawContours();

      // Switch to phase 2 either after a fixed time or once most points are near the well
      if (phase === 1) {
        const mr = meanRadiusToWell();
        if (phaseClock > PHASE_TIME || mr < PHASE_RADIUS_TRIGGER) { phase = 2; }
      }

      // Render particles
      ctx.globalCompositeOperation = 'lighter';
      const colorPhase1 = 'rgba(255,110,0,0.70)';
      const colorPhase2 = 'rgba(255,160,0,0.92)';

      for (const p of pts){
        if (phase === 1){
          // --- Gradient descent along -∇f(x,y) ---
          const { gx, gy } = gradAt(p.x, p.y); // gradient of field
          // distance to well center for slow zone logic
          const dx = p.x - targetWell.x, dy = p.y - targetWell.y;
          const r = Math.hypot(dx,dy);

          // distance-aware step size (slows as it approaches minimum)
          const slowFactor = Math.min(1, r / SLOW_ZONE_RADIUS);
          const lr = DESCENT_LR * (0.35 + 0.65 * slowFactor);

          // move opposite gradient (descent)
          p.vx += -gx * lr;
          p.vy += -gy * lr;
          p.vx *= DESCENT_DAMP; p.vy *= DESCENT_DAMP;

          if (r < SLOW_ZONE_RADIUS) {
            p.vx *= SLOW_ZONE_DAMP; p.vy *= SLOW_ZONE_DAMP;
            cap2D(p, SLOW_SPEED_CAP);
          } else {
            cap2D(p, SPEED_CAP);
          }
        } else {
          // --- Spring outward from the well to glyph targets ---
          const tx = p.t.x, ty = p.t.y;
          const dx = tx - p.x, dy = ty - p.y;
          p.vx += dx * MORPH_K;
          p.vy += dy * MORPH_K;
          p.vx *= MORPH_DAMP; p.vy *= MORPH_DAMP;
          cap2D(p, SPEED_CAP);
        }

        p.x += p.vx; p.y += p.vy;

        // Draw particle
        ctx.beginPath();
        ctx.arc(p.x, p.y, PARTICLE_RADIUS, 0, Math.PI*2);
        ctx.fillStyle = phase === 1 ? colorPhase1 : colorPhase2;
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';

      // Subtle glow around the well during phase 1
      if (phase === 1){
        const glow = ctx.createRadialGradient(targetWell.x, targetWell.y, 8, targetWell.x, targetWell.y, 120);
        glow.addColorStop(0, 'rgba(255,140,0,0.15)');
        glow.addColorStop(1, 'rgba(255,140,0,0.0)');
        ctx.fillStyle = glow; ctx.beginPath();
        ctx.arc(targetWell.x, targetWell.y, 140, 0, Math.PI*2); ctx.fill();
      }

      // Outline pulse after ∇ forms
      if (phase === 2){
        const pulse = 0.15 + 0.15*Math.sin(performance.now()/1200);
        ctx.strokeStyle = `rgba(255,140,0,${0.10 + pulse*0.10})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i=0; i<targets.length; i+=10){
          const t = targets[i];
          ctx.moveTo(t.x+1,t.y); ctx.arc(t.x, t.y, 0.9, 0, Math.PI*2);
        }
        ctx.stroke();
      }

      requestAnimationFrame(loop);
    }

    // ========================= Helpers =========================
    function meanRadiusToWell(){
      let s = 0;
      for (const p of pts){ s += Math.hypot(p.x-targetWell.x, p.y-targetWell.y); }
      return s / pts.length;
    }

    function cap2D(p, maxSpeed){
      const v2 = p.vx*p.vx + p.vy*p.vy;
      const m2 = maxSpeed*maxSpeed;
      if (v2 > m2){
        const m = Math.sqrt(v2);
        const s = maxSpeed / m;
        p.vx *= s; p.vy *= s;
      }
    }

    // ========================= Self-tests (console) =========================
    (function selfTests(){
      const results = [];
      results.push({ name: 'particles:count', pass: pts.length === N, info: `${pts.length} === ${N}` });
      results.push({ name: 'grid:size', pass: gridVals && gridVals.length === gridW*gridH, info: `${gridW}×${gridH}` });
      const allHaveTargets = pts.every(p => p.t && Number.isFinite(p.t.x) && Number.isFinite(p.t.y));
      results.push({ name: 'targets:assigned', pass: allHaveTargets, info: allHaveTargets ? 'ok' : 'missing target(s)' });
      const mr = meanRadiusToWell();
      results.push({ name: 'meanRadius:finite', pass: Number.isFinite(mr), info: `${mr.toFixed(2)}` });
      const allPass = results.every(r => r.pass);
      (allPass ? console.group : console.groupCollapsed)(allPass ? '%cSelf-tests passed' : '%cSelf-tests FAILED', 'color:#fff;background:' + (allPass ? '#27ae60' : '#c0392b') + ';padding:2px 6px;border-radius:4px');
      results.forEach(r => console.log(`${r.pass ? '✅' : '❌'} ${r.name}: ${r.info}`));
      console.groupEnd();
    })();
  </script>
</body>
</html>
